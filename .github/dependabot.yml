version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', 'prettier*', 'typescript*', '@playwright/*', '@lhci/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
