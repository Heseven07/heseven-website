name: Deploy

# Builds the site and deploys it to Cloudflare whenever:
#   - code is merged to main (main is protected: CI must pass before merging),
#   - content is published in Sanity (Sanity webhook → repository_dispatch "sanity-publish"),
#   - someone clicks "Run workflow" (manual "Deploy now").
# Setup (secrets/variables, Sanity webhook) is documented in README.md → "Deploying".

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# Several publishes in a row collapse into one deploy of the latest content.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # GA4 + Meta Pixel (public IDs, consent-gated in Analytics.astro). Read at build time.
      PUBLIC_GA4_ID: 'G-GB8B925EJJ'
      PUBLIC_META_PIXEL_ID: '564814566653097'
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable is not set — skipping deploy. See README → Deploying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      # Fetches the latest published Sanity content at build time.
      - run: npm run build:only
        if: steps.creds.outputs.ready == 'true'

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Summary
        if: steps.creds.outputs.ready == 'true'
        env:
          SANITY_ID: ${{ github.event.client_payload.id }}
          SANITY_TYPE: ${{ github.event.client_payload.type }}
        run: |
          {
            echo "### ✅ Deployed"
            case "$GITHUB_EVENT_NAME" in
              repository_dispatch) echo "Trigger: Sanity publish — \`${SANITY_TYPE:-?}\` \`${SANITY_ID:-?}\`" ;;
              push) echo "Trigger: merge to main — \`${GITHUB_SHA::7}\`" ;;
              *) echo "Trigger: manual (Run workflow)" ;;
            esac
            echo ""
            echo "Live: https://heseven-website.heseven-website.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
